name: AegisCI Automated Pipeline

on:
  push:
    branches:
      - 'main'
      - 'experiment/**'
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - 'main'
      - 'experiment/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run CI on'
        required: false
        default: 'main'

jobs:
  test-and-build:
    name: Build & Test Protected App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f sample-app/requirements.txt ]; then
            pip install -r sample-app/requirements.txt
          fi

      - name: Run Test Suite
        id: run_tests
        continue-on-error: true
        run: |
          python -m pytest --color=no sample-app/tests | tee test-output.log
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Run Semgrep Security Scan
        id: semgrep_scan
        continue-on-error: true
        run: |
          python -m pip install semgrep
          semgrep --config=auto --json --output=semgrep-results.json sample-app/ || true
          echo "Semgrep scan finished."

      - name: Build Container Image
        if: env.TEST_EXIT_CODE == '0'
        run: |
          docker build -t sample-app sample-app/

      - name: Prepare Unified AegisCI Results Payload
        id: prepare_payload
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Read test logs
          TEST_LOGS=""
          if [ -f test-output.log ]; then
            TEST_LOGS=$(cat test-output.log)
          fi

          # Read semgrep JSON
          SEMGREP_CONTENT="{}"
          if [ -f semgrep-results.json ]; then
            SEMGREP_CONTENT=$(cat semgrep-results.json)
          fi

          TEST_PASSED=true
          if [ "$TEST_EXIT_CODE" != "0" ]; then
            TEST_PASSED=false
          fi

          # Compose unified JSON payload
          jq -n \
            --arg repo "$REPO" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg branch "$BRANCH" \
            --arg run_id "$RUN_ID" \
            --arg event_name "$EVENT_NAME" \
            --argjson test_passed "$TEST_PASSED" \
            --argjson test_exit_code "$TEST_EXIT_CODE" \
            --arg logs "$TEST_LOGS" \
            --argjson semgrep_json "$SEMGREP_CONTENT" \
            '{
              repo: $repo,
              commit_sha: $commit_sha,
              branch: $branch,
              run_id: $run_id,
              event_name: $event_name,
              test_passed: $test_passed,
              test_exit_code: $test_exit_code,
              logs: $logs,
              semgrep_json: $semgrep_json,
              artifacts: ["test-output.log", "semgrep-results.json", "aegis-ci-run.json"]
            }' > aegis-ci-run.json

          echo "AegisCI unified payload created:"
          head -n 25 aegis-ci-run.json

      - name: Dispatch Results to AegisCI Backend
        if: env.TEST_EXIT_CODE != '0' || hashFiles('semgrep-results.json') != ''
        env:
          AEGIS_BACKEND_URL: ${{ secrets.AEGIS_BACKEND_URL || 'http://localhost:8000' }}
          AEGIS_WEBHOOK_SECRET: ${{ secrets.AEGIS_WEBHOOK_SECRET || '' }}
        run: |
          echo "Dispatching CI results to AegisCI at $AEGIS_BACKEND_URL/ci/results..."
          
          # Attempt dispatch with optional secret header
          HTTP_STATUS=$(curl -s -o dispatch_response.json -w "%{http_code}" \
            -X POST "$AEGIS_BACKEND_URL/ci/results" \
            -H "Content-Type: application/json" \
            -H "X-Aegis-Secret: $AEGIS_WEBHOOK_SECRET" \
            -d @aegis-ci-run.json || echo "000")

          echo "Response HTTP Status: $HTTP_STATUS"
          if [ -f dispatch_response.json ]; then
            cat dispatch_response.json
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Note: AegisCI backend at $AEGIS_BACKEND_URL unreachable or returned $HTTP_STATUS."
            echo "Artifacts are preserved in this workflow run for local ingestion."
          fi

      - name: Upload AegisCI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ci-artifacts
          path: |
            test-output.log
            semgrep-results.json
            aegis-ci-run.json
          retention-days: 14

      - name: Enforce CI Status
        run: |
          if [ "$TEST_EXIT_CODE" != "0" ]; then
            echo "CI pipeline failed due to failing tests (exit code $TEST_EXIT_CODE)."
            exit $TEST_EXIT_CODE
          fi
