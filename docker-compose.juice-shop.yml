services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: aegis-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
